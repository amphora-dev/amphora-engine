# Build the device runtime archive (runtime.bst) and, on main, publish it as a
# GitHub Release named after the archive (amphora-wine-<version>-<commit12>).
# The name changes with the Wine commit; a build that only changes packaging
# replaces the assets of the existing Release.
name: build

on:
  push:
    branches: [main]
    paths:
    - "elements/**"
    - "ci/**"
    - "project.conf"
    - ".github/actions/setup-buildstream/**"
    - ".github/workflows/build.yml"
  pull_request:
    paths:
    - "elements/**"
    - "ci/**"
    - "project.conf"
    - ".github/actions/setup-buildstream/**"
    - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# The recc snapshot below is immutable and cannot be merged; serialize runs on
# the same ref so every main build restores and extends the latest one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Bump to drop every snapshot (e.g. after a cache-format change).
  SNAPSHOT_PREFIX: recc-v1-linux-

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
        df -h /

    - uses: ./.github/actions/setup-buildstream
      with:
        remote-cache-token: ${{ secrets.BST_REMOTE_CACHE_TOKEN }}

    # Only the artifact index is queried. When the exact Wine artifact is
    # available, skip downloading the action-cache snapshot.
    - name: Is the Wine element cached?
      id: wine
      run: |
        state="$(./bst artifact show --deps none wine/wine.bst)"
        echo "$state"
        if grep -Eq '^[[:space:]]*(cached|available)[[:space:]]+wine/wine\.bst([[:space:]]|$)' <<<"$state"; then
          echo "cached=true" >> "$GITHUB_OUTPUT"
        else
          echo "cached=false" >> "$GITHUB_OUTPUT"
        fi

    # Action results point at blobs in CAS, so both directories go together.
    - name: Restore recc snapshot
      id: restore
      if: steps.wine.outputs.cached != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/buildstream/cas
          ~/.cache/buildstream/actioncache
        key: ${{ env.SNAPSHOT_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ env.SNAPSHOT_PREFIX }}

    # With a restored snapshot, serve recc locally instead of validating every
    # action over the WAN (docs/CACHE.md); artifacts still use the remote.
    - name: Use the restored snapshot for recc
      if: steps.restore.outputs.cache-matched-key != ''
      env:
        BST_ACTION_CACHE_MODE: local
        BST_REMOTE_CACHE_TOKEN: ${{ secrets.BST_REMOTE_CACHE_TOKEN }}
      run: bash ci/setup/configure-remote-cache.sh

    - name: Build
      id: build
      run: |
        ./bst build runtime.bst
        summary="$(find ~/.cache/buildstream/logs -type f -path '*wine-wine*build*.log' -print0 |
          xargs -0 -r grep -h 'recc actions:' | tail -n 1 || true)"
        if [ -n "$summary" ]; then
          echo "::notice::$summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "wine-built=true" >> "$GITHUB_OUTPUT"
        fi
        rm -rf out
        ./bst artifact checkout runtime.bst --directory out/runtime
        cat out/runtime/artifacts/runtime.env >> "$GITHUB_ENV"
        cat out/runtime/artifacts/runtime.env >> "$GITHUB_STEP_SUMMARY"

    - name: Save recc snapshot
      id: save
      if: success() && github.ref == 'refs/heads/main' && steps.build.outputs.wine-built == 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cache/buildstream/cas
          ~/.cache/buildstream/actioncache
        key: ${{ env.SNAPSHOT_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}

    - name: Keep the newest two snapshots
      if: success() && steps.save.outcome == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh cache list --ref refs/heads/main --key "$SNAPSHOT_PREFIX" --limit 100 \
            --json id,createdAt --jq 'sort_by(.createdAt) | reverse | .[2:][]?.id' |
          while read -r id; do
            [ -n "$id" ] && gh api --method DELETE "repos/$GH_REPO/actions/caches/$id"
          done

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RUNTIME_NAME }}
        path: out/runtime/artifacts/*
        if-no-files-found: error
        retention-days: 14

    - name: Publish Release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        notes="Wine ${WINE_VERSION}, amphora-dev/proton-wine@${WINE_COMMIT}
        Built from ${GITHUB_SHA}. sha256 ${RUNTIME_SHA256}, ${RUNTIME_FILES} files, ${RUNTIME_BYTES} bytes unpacked."
        files=(out/runtime/artifacts/*)
        if gh release view "$RUNTIME_NAME" >/dev/null 2>&1; then
          gh release upload "$RUNTIME_NAME" --clobber "${files[@]}"
          gh release edit "$RUNTIME_NAME" --notes "$notes"
        else
          gh release create "$RUNTIME_NAME" --target "$GITHUB_SHA" --title "$RUNTIME_NAME" \
            --notes "$notes" "${files[@]}"
        fi
