# Build the device runtime archive (runtime.bst) and, on main, publish it as a
# GitHub Release named after the archive (amphora-wine-<version>-<commit12>).
# The name changes with the Wine commit; a build that only changes packaging
# replaces the assets of the existing Release.
name: build

on:
  push:
    branches: [main]
    paths:
    - "elements/**"
    - "scripts/**"
    - "ci/cache/**"
    - "ci/setup/**"
    - "project.conf"
    - "bst"
    - ".github/actions/setup-buildstream/**"
    - ".github/workflows/build.yml"
  pull_request:
    paths:
    - "elements/**"
    - "scripts/**"
    - "ci/cache/**"
    - "ci/setup/**"
    - "project.conf"
    - "bst"
    - ".github/actions/setup-buildstream/**"
    - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      upload-cache:
        description: Also upload the build cache as a workflow artifact (ci/cache/pull-ci.sh)
        type: boolean
        default: false
  # GitHub evicts a cache entry after 7 days without access. A no-change run
  # restores the snapshot (an access) and builds nothing.
  schedule:
  - cron: "17 3 * * 1,4"

permissions:
  actions: write
  contents: write

# Snapshots are immutable and cannot be merged; serialize runs on the same ref
# so every main build restores and extends the latest one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # Bump to drop every snapshot (e.g. after a layout change in ci/cache/snapshot.py).
  SNAPSHOT_PREFIX: bst-v3-
  SNAPSHOT_DIR: ~/.cache/amphora-snapshot

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup-buildstream

    # The snapshot is named after runtime.bst's cache key, which covers every
    # input of the build. An exact hit means there is nothing to build.
    - name: Snapshot key
      id: key
      run: echo "key=${SNAPSHOT_PREFIX}$(./bst --no-colors show --deps none --format '%{full-key}' runtime.bst)" >> "$GITHUB_OUTPUT"

    # Snapshots come from main (PRs and branches can read them). Only this
    # project's artifacts and recc results; the SDK is refetched when needed.
    - name: Restore snapshot
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.SNAPSHOT_DIR }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ env.SNAPSHOT_PREFIX }}

    - name: Import snapshot
      if: steps.restore.outputs.cache-matched-key != ''
      run: bash ci/cache/snapshot.sh import "$SNAPSHOT_DIR"

    - name: Build
      id: build
      run: |
        ./bst build runtime.bst
        summary="$(find ~/.cache/buildstream/logs -type f -path '*wine-wine*build*.log' -print0 |
          xargs -0 -r grep -h 'recc actions:' | tail -n 1 || true)"
        if [ -n "$summary" ]; then
          echo "::notice::$summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
        fi
        rm -rf out
        ./bst artifact checkout runtime.bst --directory out/runtime
        cat out/runtime/artifacts/runtime.env >> "$GITHUB_ENV"
        cat out/runtime/artifacts/runtime.env >> "$GITHUB_STEP_SUMMARY"
        # The runner has about 75 GB free; a cold build needs far less, so
        # nothing is deleted up front (that took 50 s). Watch the peak here.
        df -h / | tail -n 1 | awk '{print "disk after build: " $3 " used, " $4 " free"}' | tee -a "$GITHUB_STEP_SUMMARY"

    # Also after a failed build: compile results from a Wine build that broke
    # halfway are still valid. Such a snapshot gets a -failed suffix, so the
    # exact key stays free for the next successful run.
    - name: Export snapshot
      id: export
      if: >-
        always() && github.ref == 'refs/heads/main' &&
        steps.restore.outputs.cache-hit != 'true' && steps.build.outcome != 'skipped'
      run: |
        bash ci/cache/snapshot.sh export "$SNAPSHOT_DIR" | tee -a "$GITHUB_STEP_SUMMARY"
        key="${{ steps.key.outputs.key }}"
        if [ "${{ steps.build.outcome }}" != success ]; then
          key="$key-failed-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        fi
        echo "key=$key" >> "$GITHUB_OUTPUT"

    - name: Save snapshot
      id: save
      if: always() && steps.export.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.SNAPSHOT_DIR }}
        key: ${{ steps.export.outputs.key }}

    # Restores only ever take the newest snapshot, and each one carries
    # everything the next run needs, so older ones are dead weight.
    - name: Keep only the newest snapshot
      if: always() && steps.save.outcome == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh cache list --ref refs/heads/main --key "$SNAPSHOT_PREFIX" --limit 100 \
            --json id,createdAt --jq 'sort_by(.createdAt) | reverse | .[1:][]?.id' |
          while read -r id; do
            [ -n "$id" ] && gh api --method DELETE "repos/$GH_REPO/actions/caches/$id"
          done

    # On request only (manual run with upload-cache, or "[upload-cache]" in the
    # head commit message): the snapshot as a downloadable artifact, so a dev
    # machine can import CI's build (ci/cache/pull-ci.sh). The Actions cache
    # itself cannot be downloaded from outside a workflow.
    - name: Pack build cache for download
      id: pack
      if: >-
        steps.build.outcome == 'success' && (inputs.upload-cache ||
        contains(github.event.head_commit.message, '[upload-cache]'))
      run: |
        if [ "${{ steps.export.outcome }}" != success ]; then
          bash ci/cache/snapshot.sh export "$SNAPSHOT_DIR"
        fi
        dir="$(eval echo "$SNAPSHOT_DIR")"
        echo "${{ steps.key.outputs.key }}" > "$dir/KEY"
        tar -C "$dir" -cf - . | zstd -T0 -6 -q -o "$RUNNER_TEMP/bst-cache.tar.zst"
        ls -l "$RUNNER_TEMP/bst-cache.tar.zst"

    - if: steps.pack.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: bst-cache
        path: ${{ runner.temp }}/bst-cache.tar.zst
        compression-level: 0
        retention-days: 7

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RUNTIME_NAME }}
        path: out/runtime/artifacts/*
        if-no-files-found: error
        retention-days: 14

    - name: Publish Release
      if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        notes="Wine ${WINE_VERSION}, amphora-dev/proton-wine@${WINE_COMMIT}
        Built from ${GITHUB_SHA}. sha256 ${RUNTIME_SHA256}, ${RUNTIME_FILES} files, ${RUNTIME_BYTES} bytes unpacked."
        files=(out/runtime/artifacts/*)
        if gh release view "$RUNTIME_NAME" >/dev/null 2>&1; then
          gh release upload "$RUNTIME_NAME" --clobber "${files[@]}"
          gh release edit "$RUNTIME_NAME" --notes "$notes"
        else
          gh release create "$RUNTIME_NAME" --target "$GITHUB_SHA" --title "$RUNTIME_NAME" \
            --notes "$notes" "${files[@]}"
        fi
